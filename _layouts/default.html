<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.55;
      }
      body { margin: 0; }
      main { max-width: 900px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
      img, svg { max-width: 100%; height: auto; }
      pre { overflow-x: auto; padding: 1rem; border: 1px solid #8c959f; border-radius: 4px; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      table { border-collapse: collapse; display: block; overflow-x: auto; }
      th, td { border: 1px solid #8c959f; padding: 0.5rem 0.7rem; text-align: left; }
      .mermaid { margin: 1.5rem 0; overflow-x: auto; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
        const diagram = document.createElement("div");
        diagram.className = "mermaid";
        diagram.textContent = code.textContent;
        code.parentElement.replaceWith(diagram);
      });
      mermaid.initialize({ startOnLoad: true, securityLevel: "strict" });
    </script>
  </body>
</html>
